{{/* Site footer. Keeps the configured copyright/licence notice from params.yaml. */}}
<footer class="site-footer">
  <div class="wrap fgrid">
    <span>{{ site.Params.footer.copyright.notice }}</span>
    <span>
      {{ range site.Params.marketing.social | default slice }}{{ end }}
      <a href="https://github.com/Jajaho">GitHub</a> ·
      <a href="https://www.linkedin.com/in/jakob-holz">LinkedIn</a> ·
      <a href="{{ "index.xml" | relURL }}">RSS</a>
    </span>
  </div>
</footer>
