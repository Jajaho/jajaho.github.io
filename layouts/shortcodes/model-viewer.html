<!-- layouts/shortcodes/model-viewer.html -->
<div class="model-viewer-container">
    <div class="firefox-warning" style="display: none; padding: 1rem; margin: 1rem 0; border-radius: 4px; max-width: 800px; margin: 0 auto;" 
         class="bg-yellow-50 dark:bg-yellow-900 border border-yellow-200 dark:border-yellow-700 text-yellow-800 dark:text-yellow-200">
        ⚠️ This large 3D model may not display correctly in Firefox. Please use Chrome for the best experience.
    </div>
    <div style="width: 100%; height: 600px; max-width: 800px; margin: 0 auto;">
        <model-viewer
            style="width: 100%; height: 100%;" 
            class="bg-gray-100 dark:bg-gray-800"
            src="{{ .Get "src" | default "https://modelviewer.dev/shared-assets/models/Astronaut.glb"}}"
            alt="{{ .Get "alt" | default "A 3D model" }}"
            camera-controls
            {{ with .Get "ios-src" }}ios-src="{{ . }}"{{ end }}
            shadow-intensity="1"
            camera-orbit="{{ .Get "camera-orbit" | default "0deg 75deg 1500m" }}"
            exposure="1"
            shadow-softness="0.5">
        </model-viewer>
    </div>
</div>
<script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<script>
async function checkModelSize() {
    if (navigator.userAgent.toLowerCase().indexOf('firefox') === -1) return;
    const modelViewers = document.querySelectorAll('model-viewer');
    const warnings = document.querySelectorAll('.firefox-warning');
   
    modelViewers.forEach(async (viewer, index) => {
        const modelUrl = viewer.getAttribute('src');
        console.log('Checking model URL:', modelUrl); // Debug log
        try {
            const response = await fetch(modelUrl, { method: 'HEAD' });
            if (!response.ok) {
                console.error('Model file not found:', modelUrl);
                return;
            }
            const sizeInMB = response.headers.get('content-length') / (1024 * 1024);
            if (sizeInMB > 100 && warnings[index]) {
                warnings[index].style.display = 'block';
            }
        } catch (error) {
            console.error('Error checking model size:', error);
        }
    });
}
checkModelSize();
</script>
