{{ with .Get "model" }}
<div style="width: 100%; height: 400px;">
    <model-viewer 
        src="{{ . }}"
        alt="{{ $.Get `alt` | default `3D model` }}"
        {{ with $.Get "ar" }}ar{{ end }}
        {{ with $.Get "auto-rotate" }}auto-rotate{{ end }}
        {{ with $.Get "camera-controls" }}camera-controls{{ end }}
        style="width: 100%; height: 100%;">
    </model-viewer>
</div>
{{ end }}
