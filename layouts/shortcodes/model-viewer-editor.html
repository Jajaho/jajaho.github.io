

  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="static/model-viewer-editor-styles.css" rel="stylesheet"/>
  </head>
  <body>
    <div class="viewer-container">
        <!-- <model-viewer> HTML element -->
        <model-viewer src="printsheet-holder2-Fillet.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1">
        <button class="Hotspot" slot="hotspot-1" data-position="4.560519934242649m 46.61766732054646m 5.664256425750992m" data-normal="0m 0.19270889251127332m 0.9812559720822486m" data-visibility-attribute="visible">
            <div class="HotspotAnnotation">More material required here.</div>
        </button>
        <div class="progress-bar hide" slot="progress-bar">
            <div class="update-bar"></div>
        </div>
        <button slot="ar-button" id="ar-button">
            View in your space
        </button>
        <div id="ar-prompt">
            <img src="ar_hand_prompt.png">
        </div>
        </model-viewer>  
    </div>

    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  </body>
