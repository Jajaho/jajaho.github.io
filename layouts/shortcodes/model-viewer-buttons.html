<!-- layouts/shortcodes/model-viewer.html -->
<script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<style>
    .viewer-container {
        width: 100%;
        height: 600px;
        max-width: 800px;
        margin: 0 auto;
    }
    
    model-viewer {
        width: 100%;
        height: 100%;
        background-color: #f5f5f5;
    }

    .controls {
        margin-top: 20px;
        text-align: center;
    }

    button {
        padding: 8px 16px;
        margin: 0 5px;
        cursor: pointer;
    }
</style>

<div class="viewer-container">
    <model-viewer
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        alt="A 3D model of an astronaut"
        camera-controls
        auto-rotate
        ar
        ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
        shadow-intensity="1"
        camera-orbit="45deg 55deg 2.5m"
        exposure="1"
        shadow-softness="0.5"
    ></model-viewer>

    <div class="controls">
        <button onclick="document.querySelector('model-viewer').autoRotate = true">Start Rotation</button>
        <button onclick="document.querySelector('model-viewer').autoRotate = false">Stop Rotation</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const modelViewer = document.querySelector('model-viewer');

        modelViewer.addEventListener('load', () => {
            console.log('Model loaded successfully');
        });

        modelViewer.addEventListener('error', (error) => {
            console.error('Error loading model:', error);
        });
    });
</script>
