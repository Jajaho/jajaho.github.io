# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name
title: Jakob Holz
# Website URL
baseURL: 'https://www.jakobholz.com/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
permalinks:
  authors: '/author/:slug/'
disableAliases: false
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 80
  anchor: smart
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  goldmark:
    parser:
      # A lone image on its own line becomes a block-level node instead of
      # being wrapped in <p>. The image render hook turns a `.pdf` destination
      # into a <div class="wgt"> viewer, and the HTML parser auto-closes an
      # open <p> before a <div> — which would strand an empty paragraph after
      # every embedded document. Plain images gain from it too: they render a
      # <figure>, which never belonged inside a paragraph either.
      wrapStandAloneImageWithinParagraph: false
  highlight:
    lineNos: false
security:
  _merge: deep
sitemap:
  _merge: deep

############################
## CUSTOM
############################

params:
  modelViewer:
    folder: "models" # Relative to the assets/ folder, managed by hugo
  github:
    username: "Jajaho"
    repo: "HugoBloxSite"
    releaseTag: "v1.0.0"  # Version tag for your 3D model release
