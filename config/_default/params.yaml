# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: blue

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Jakob Holz third personal website.'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: false
    show_theme_chooser: true
    logo:
      text: "Jakob Holz"

# Site footer
footer:
  copyright:
    notice: '© 2024-2025 Jakob Holz. All rights reserved.'
    license:
      enable: true
      allow_derivatives: false
      share_alike: false
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false

# Redesign (Copper). Set `redesign: false` to fall back to the HugoBlox theme bundle.
redesign: true
hero:
  headline: 'Electronics, physics, and things taken apart.'
  lede: >-
    I build measurement hardware, work on cold-atom experiments, and fix whatever
    lands on the bench. Everything here is documented the way I would want to find
    it: schematics, measurements, and the parts that did not work.
